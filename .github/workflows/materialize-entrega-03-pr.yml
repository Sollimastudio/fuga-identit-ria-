name: Materializar Entrega 03 via PR

on:
  pull_request_target:
    branches: [main]
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'agent/entrega-03'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar ramificação da Entrega 03
        uses: actions/checkout@v4
        with:
          ref: agent/entrega-03
          fetch-depth: 0

      - name: Materializar e validar pacote editorial
        run: bash .github/scripts/materialize-entrega-03.sh
