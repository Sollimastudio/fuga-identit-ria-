name: Materializar Entrega 03 via PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/entrega-03
          fetch-depth: 0
      - name: Materializar pacote editorial
        run: bash .github/scripts/materialize-entrega-03.sh
