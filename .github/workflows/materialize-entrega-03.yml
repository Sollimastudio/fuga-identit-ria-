name: Materializar Entrega 03

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entrega-03-operacional
          fetch-depth: 0

      - name: Preparar ambiente editorial
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-core poppler-utils fonts-urw-base35 fonts-noto-core fonts-dejavu-core python3-pip libcairo2 libpango-1.0-0 libpangocairo-1.0-0
          python -m pip install --upgrade pip
          python -m pip install python-docx cairosvg pillow

      - name: Extrair e gerar arquivos
        run: |
          rm -rf /tmp/entrega03-source
          mkdir -p /tmp/entrega03-source 04-ENTREGAS-PARA-REVISAO/ENTREGA-03
          cat .entrega03-source.part-00 .entrega03-source.part-01 .entrega03-source.part-02 .entrega03-source.part-03a .entrega03-source.part-03b .entrega03-source.part-03c .entrega03-source.part-03d .entrega03-source.part-04 | base64 -d > /tmp/entrega03-source.tar.gz
          test "$(sha256sum /tmp/entrega03-source.tar.gz | cut -d' ' -f1)" = "6cf8bb9e2930150375d94ae23fb3bad6caaba25d6ef079656e37bc311e3b4afa"
          tar -xzf /tmp/entrega03-source.tar.gz -C /tmp/entrega03-source
          cp -a /tmp/entrega03-source/ENTREGA-03/. 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/
          cp /tmp/entrega03-source/FERRAMENTAS/build_entrega_03.py 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/build_entrega_03.py
          cd 04-ENTREGAS-PARA-REVISAO/ENTREGA-03
          python build_entrega_03.py
          test -s Fuga_Identitaria_Entrega_03_Parte_III.docx
          test -s Fuga_Identitaria_Entrega_03_Parte_III.pdf
          test "$(pdfinfo Fuga_Identitaria_Entrega_03_Parte_III.pdf | awk '/^Pages:/ {print $2}')" -ge 58
          pdftotext Fuga_Identitaria_Entrega_03_Parte_III.pdf /tmp/entrega03-text.txt
          grep -q 'Capítulo 12' /tmp/entrega03-text.txt

      - name: Atualizar estrutura editorial
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          delivery = root / '04-ENTREGAS-PARA-REVISAO/ENTREGA-03'

          research = root / '02-PESQUISA-E-CONTROLE/REGISTRO_PESQUISA_ENTREGA_03.md'
          research.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('/tmp/entrega03-source/PESQUISA/REGISTRO_PESQUISA_ENTREGA_03.md', research)

          for target in (
              root / '05-FERRAMENTAS/build_entrega_03.py',
              root / 'repo_package/05-FERRAMENTAS/build_entrega_03.py',
          ):
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(delivery / 'build_entrega_03.py', target)

          for target in (
              root / 'manuscrito/entregas/entrega-03',
              root / 'repo_package/04-ENTREGAS-PARA-REVISAO/ENTREGA-03',
          ):
              if target.exists():
                  shutil.rmtree(target)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(delivery, target)

          def append_once(path: Path, marker: str, block: str) -> None:
              old = path.read_text(encoding='utf-8') if path.exists() else ''
              if marker not in old:
                  path.write_text(old.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          append_once(root / 'README.md', '<!-- ENTREGA-03-2026-07-27 -->', '''
          <!-- ENTREGA-03-2026-07-27 -->
          ## Entrega 3 — Parte III concluída para revisão

          A Parte III — **Os fornecedores do eu** — foi produzida integralmente com os capítulos 8 a 12, 9.885 palavras de texto principal, quatro figuras funcionais, DOCX e PDF de revisão. O conteúdo está em `04-ENTREGAS-PARA-REVISAO/ENTREGA-03/`.

          **Estado:** Escrita integral → Auditoria factual → Revisão editorial → **Revisão de Sol**. Não aprovada e não fundida ao manuscrito mestre.
          ''')

          append_once(root / 'STATUS_EDITORIAL.md', '<!-- STATUS-ENTREGA-03-2026-07-27 -->', '''
          <!-- STATUS-ENTREGA-03-2026-07-27 -->
          ## Entrega 3 — Parte III — Os fornecedores do eu

          - capítulos 8 a 12 completos;
          - texto principal: 9.885 palavras;
          - faixa editorial: 114–172;
          - figuras: FIG-07 a FIG-10;
          - DOCX e PDF concluídos e auditados;
          - estado: **aguardando revisão de Sol**;
          - manuscrito mestre: **não alterado**;
          - próxima entrega preparada: Parte IV — capítulos 13 a 17.
          ''')

          append_once(root / 'CHANGELOG.md', '<!-- CHANGELOG-ENTREGA-03-2026-07-27 -->', '''
          <!-- CHANGELOG-ENTREGA-03-2026-07-27 -->
          ## 2026-07-27 — Entrega 3

          - escrita integral da Parte III — *Os fornecedores do eu*;
          - capítulos 8 a 12 fechados com casos compostos e contracasos;
          - 9.885 palavras de texto principal;
          - FIG-07 a FIG-10 em SVG e PNG;
          - DOCX refluível e PDF 14 × 21 cm;
          - registro editorial e registro de pesquisa;
          - prompt operacional da Entrega 4;
          - cópias em `manuscrito/entregas/entrega-03/` e `repo_package/`;
          - nenhuma fusão ao manuscrito mestre.
          ''')

          append_once(root / 'CONTINUIDADE_NOVO_CHAT.md', '<!-- CONTINUIDADE-ENTREGA-03-2026-07-27 -->', '''
          <!-- CONTINUIDADE-ENTREGA-03-2026-07-27 -->
          # Atualização de continuidade — Entrega 3 concluída

          **Ponto exato:** a Parte III — *Os fornecedores do eu* — está tecnicamente completa em `04-ENTREGAS-PARA-REVISAO/ENTREGA-03/`, com capítulos 8 a 12, figuras, DOCX, PDF, registro editorial e pesquisa. Aguarda revisão de Sol. Não foi aprovada nem fundida ao manuscrito mestre.

          **Próximo escopo:** Entrega 4 — Parte IV — *A anatomia da ocupação*, capítulos 13 a 17, iniciando na página editorial 173. O comando operacional está em `04-ENTREGAS-PARA-REVISAO/ENTREGA-03/PROMPT_PROXIMA_ENTREGA_04.md`.

          **Gatilho:** `Comece a Entrega 4.`
          ''')

          append_once(root / '02-PESQUISA-E-CONTROLE/FUGA_IDENTITARIA_CENTRAL_DE_PESQUISA.md', '<!-- CENTRAL-PESQUISA-ENTREGA-03-2026-07-27 -->', '''
          <!-- CENTRAL-PESQUISA-ENTREGA-03-2026-07-27 -->
          ## Registro de pesquisa — Entrega 3

          **Escopo:** Parte III — *Os fornecedores do eu*, capítulos 8 a 12. Foram promovidas fontes sobre desenvolvimento identitário, autonomia parental, mediação de mídia, sistemas de recomendação, comparação social, relações parassociais, avatares, fusão de identidade, feminismos, manosfera, terminologia LGBTQIA+, apagamento bissexual e comunidades therian/otherkin.

          **Correções protegidas:** algoritmo não conhece essência; telas não foram usadas para diagnosticar; movimentos diferentes não foram declarados moralmente equivalentes; LGBTQIA+ não foi tratada como fuga; o sinal “+” não incorpora qualquer autoidentificação; therian/otherkin foram separados de LGBTQIA+ e de licantropia clínica; amostras qualitativas pequenas não foram usadas para prevalência.

          **Registro detalhado:** `02-PESQUISA-E-CONTROLE/REGISTRO_PESQUISA_ENTREGA_03.md`.

          **Estado:** pesquisa verificada e promovida para a Entrega 3; conteúdo aguardando revisão de Sol; sem fusão ao manuscrito mestre.
          ''')

          paths = [
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/FUGA_IDENTITARIA_ENTREGA_03_TEXTO.md',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/Fuga_Identitaria_Entrega_03_Parte_III.docx',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/Fuga_Identitaria_Entrega_03_Parte_III.pdf',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/REGISTRO_EDITORIAL_ENTREGA_03.md',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/PROMPT_PROXIMA_ENTREGA_04.md',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-07_DE_ONDE_CHEGAM_OS_MAPAS_DO_EU.svg',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-07_DE_ONDE_CHEGAM_OS_MAPAS_DO_EU.png',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-08_O_CICLO_DA_RECOMENDACAO.svg',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-08_O_CICLO_DA_RECOMENDACAO.png',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-09_EU_VIVIDO_E_EU_EXIBIDO.svg',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-09_EU_VIVIDO_E_EU_EXIBIDO.png',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-10_QUANDO_A_CAUSA_COMECA_A_USAR_A_PESSOA.svg',
              '04-ENTREGAS-PARA-REVISAO/ENTREGA-03/figuras/FIG-10_QUANDO_A_CAUSA_COMECA_A_USAR_A_PESSOA.png',
              '02-PESQUISA-E-CONTROLE/REGISTRO_PESQUISA_ENTREGA_03.md',
              '05-FERRAMENTAS/build_entrega_03.py',
              'manuscrito/entregas/entrega-03/',
              'repo_package/04-ENTREGAS-PARA-REVISAO/ENTREGA-03/',
              'repo_package/05-FERRAMENTAS/build_entrega_03.py',
          ]
          rows = '\n'.join(f'| `{p}` | Entrega 3 — aguardando revisão de Sol |' for p in paths)
          append_once(root / 'MANIFESTO_DE_ARQUIVOS.md', '<!-- MANIFESTO-ENTREGA-03-2026-07-27 -->', f'''
          <!-- MANIFESTO-ENTREGA-03-2026-07-27 -->
          ## Arquivos materiais da Entrega 3

          | Destino | Função |
          |---|---|
          {rows}
          ''')
          PY

      - name: Limpar material operacional e publicar branch
        run: |
          rm -f .entrega03-source.part-* .entrega03-materialize ENTREGA03_BUILD_LOG.txt ENTREGA03_DIAGNOSTICO.txt
          rm -f .github/workflows/materialize-entrega-03.yml
          rm -rf 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/_lo_home 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/_lo_pdf
          rm -rf manuscrito/entregas/entrega-03/_lo_home manuscrito/entregas/entrega-03/_lo_pdf
          rm -rf repo_package/04-ENTREGAS-PARA-REVISAO/ENTREGA-03/_lo_home repo_package/04-ENTREGAS-PARA-REVISAO/ENTREGA-03/_lo_pdf
          test -s 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/Fuga_Identitaria_Entrega_03_Parte_III.pdf
          test -s manuscrito/entregas/entrega-03/Fuga_Identitaria_Entrega_03_Parte_III.docx
          test -s repo_package/04-ENTREGAS-PARA-REVISAO/ENTREGA-03/FUGA_IDENTITARIA_ENTREGA_03_TEXTO.md
          test -s 05-FERRAMENTAS/build_entrega_03.py
          test -s repo_package/05-FERRAMENTAS/build_entrega_03.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f
          git commit -m 'build: materializa Entrega 03 completa'
          git push origin HEAD:entrega-03-operacional
