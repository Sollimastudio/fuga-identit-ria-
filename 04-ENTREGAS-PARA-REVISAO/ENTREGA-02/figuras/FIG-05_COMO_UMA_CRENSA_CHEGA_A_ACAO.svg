<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650" role="img" aria-labelledby="title desc">
<title id="title">Como uma crença chega à ação</title>
<desc id="desc">Um encadeamento influenciado, não um destino mecânico.</desc>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,6 L0,12 z" fill="#D84A3A"/>
</marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0B1020" flood-opacity=".10"/>
</filter>
</defs>
<rect width="1200" height="1650" fill="#F4EFE6"/>
<rect x="0" y="0" width="1200" height="36" fill="#D84A3A"/>
<text x="90" y="118" font-family="Nimbus Sans Narrow" font-size="58" font-weight="700" fill="#0B1020">Como uma crença chega à ação</text>
<text x="90" y="170" font-family="Nimbus Sans" font-size="26" fill="#5F7F83">Um encadeamento influenciado, não um destino mecânico.</text>
<line x1="90" y1="205" x2="1110" y2="205" stroke="#5F7F83" stroke-width="3"/>
<rect x="105" y="265" width="660" height="180" rx="22" fill="#FFFFFF" stroke="#5F7F83" stroke-width="3" filter="url(#shadow)"/>
<rect x="105" y="265" width="18" height="180" rx="9" fill="#0B1020"/>
<text x="165" y="337" font-family="Nimbus Sans" font-size="32" font-weight="700" fill="#0B1020">CRENÇAS</text>
<text x="165" y="390" font-family="Bitstream Charter" font-size="27" fill="#20242B">O que considero verdadeiro</text>
<line x1="435" y1="455" x2="435" y2="488" stroke="#D84A3A" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="105" y="500" width="660" height="180" rx="22" fill="#FFFFFF" stroke="#5F7F83" stroke-width="3" filter="url(#shadow)"/>
<rect x="105" y="500" width="18" height="180" rx="9" fill="#D84A3A"/>
<text x="165" y="572" font-family="Nimbus Sans" font-size="32" font-weight="700" fill="#0B1020">HIERARQUIA DE VALORES</text>
<text x="165" y="625" font-family="Bitstream Charter" font-size="27" fill="#20242B">O que vence quando há custo</text>
<line x1="435" y1="690" x2="435" y2="723" stroke="#D84A3A" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="105" y="735" width="660" height="180" rx="22" fill="#FFFFFF" stroke="#5F7F83" stroke-width="3" filter="url(#shadow)"/>
<rect x="105" y="735" width="18" height="180" rx="9" fill="#0B1020"/>
<text x="165" y="807" font-family="Nimbus Sans" font-size="32" font-weight="700" fill="#0B1020">INTERPRETAÇÃO</text>
<text x="165" y="860" font-family="Bitstream Charter" font-size="27" fill="#20242B">O significado recebido</text>
<line x1="435" y1="925" x2="435" y2="958" stroke="#D84A3A" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="105" y="970" width="660" height="180" rx="22" fill="#FFFFFF" stroke="#5F7F83" stroke-width="3" filter="url(#shadow)"/>
<rect x="105" y="970" width="18" height="180" rx="9" fill="#0B1020"/>
<text x="165" y="1042" font-family="Nimbus Sans" font-size="32" font-weight="700" fill="#0B1020">DECISÃO</text>
<text x="165" y="1095" font-family="Bitstream Charter" font-size="27" fill="#20242B">A escolha possível no contexto</text>
<line x1="435" y1="1160" x2="435" y2="1193" stroke="#D84A3A" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="105" y="1205" width="660" height="180" rx="22" fill="#FFFFFF" stroke="#5F7F83" stroke-width="3" filter="url(#shadow)"/>
<rect x="105" y="1205" width="18" height="180" rx="9" fill="#D84A3A"/>
<text x="165" y="1277" font-family="Nimbus Sans" font-size="32" font-weight="700" fill="#0B1020">CONSEQUÊNCIA</text>
<text x="165" y="1330" font-family="Bitstream Charter" font-size="27" fill="#20242B">O que reforça ou revisa</text>
<rect x="820" y="365" width="285" height="880" rx="26" fill="#0B1020"/>
<text x="962" y="435" text-anchor="middle" font-family="Nimbus Sans" font-size="29" font-weight="700" fill="#FFFFFF">INTERFEREM</text>
<text x="962" y="475" text-anchor="middle" font-family="Nimbus Sans" font-size="25" fill="#F4EFE6">em todo o percurso</text>
<rect x="865" y="535" width="195" height="84" rx="16" fill="#5F7F83"/>
<text x="962" y="588" text-anchor="middle" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#FFFFFF">EMOÇÃO</text>
<rect x="865" y="663" width="195" height="84" rx="16" fill="#5F7F83"/>
<text x="962" y="716" text-anchor="middle" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#FFFFFF">CONTEXTO</text>
<rect x="865" y="791" width="195" height="84" rx="16" fill="#5F7F83"/>
<text x="962" y="844" text-anchor="middle" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#FFFFFF">PODER</text>
<rect x="865" y="919" width="195" height="84" rx="16" fill="#5F7F83"/>
<text x="962" y="972" text-anchor="middle" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#FFFFFF">VÍNCULOS</text>
<rect x="865" y="1047" width="195" height="84" rx="16" fill="#5F7F83"/>
<text x="962" y="1100" text-anchor="middle" font-family="Nimbus Sans" font-size="25" font-weight="700" fill="#FFFFFF">RECURSOS</text>
<text x="600.0" y="1595" text-anchor="middle" font-family="Nimbus Sans" font-size="24" fill="#666B73">Autoria enxerga onde há escolha e onde a escolha foi reduzida.</text>
</svg>