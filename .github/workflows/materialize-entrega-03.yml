name: Materializar Entrega 03

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entrega-03-operacional
          fetch-depth: 0

      - name: Preparar ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-urw-base35 fonts-noto-core python3-pip libcairo2
          python -m pip install --upgrade pip
          python -m pip install python-docx cairosvg pillow

      - name: Extrair e gerar a entrega
        run: |
          rm -rf /tmp/entrega03-source
          mkdir -p /tmp/entrega03-source 04-ENTREGAS-PARA-REVISAO/ENTREGA-03
          cat .entrega03-source.part-* | base64 -d > /tmp/entrega03-source.tar.gz
          tar -xzf /tmp/entrega03-source.tar.gz -C /tmp/entrega03-source
          cp -a /tmp/entrega03-source/ENTREGA-03/. 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/
          cp /tmp/entrega03-source/FERRAMENTAS/build_entrega_03.py 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/build_entrega_03.py
          cd 04-ENTREGAS-PARA-REVISAO/ENTREGA-03
          python build_entrega_03.py
          test -s Fuga_Identitaria_Entrega_03_Parte_III.docx
          test -s Fuga_Identitaria_Entrega_03_Parte_III.pdf
          test "$(pdfinfo Fuga_Identitaria_Entrega_03_Parte_III.pdf | awk '/^Pages:/ {print $2}')" -ge 58
          pdftotext Fuga_Identitaria_Entrega_03_Parte_III.pdf /tmp/entrega03-text.txt
          grep -q 'Capítulo 12' /tmp/entrega03-text.txt
          grep -q 'Notas de pesquisa da Entrega 3' /tmp/entrega03-text.txt

      - name: Registrar, copiar e auditar
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, shutil

          root = Path('.')
          delivery = root / '04-ENTREGAS-PARA-REVISAO/ENTREGA-03'
          registry = delivery / 'REGISTRO_EDITORIAL_ENTREGA_03.md'
          named = {
              'FUGA_IDENTITARIA_ENTREGA_03_TEXTO.md': delivery/'FUGA_IDENTITARIA_ENTREGA_03_TEXTO.md',
              'Fuga_Identitaria_Entrega_03_Parte_III.docx': delivery/'Fuga_Identitaria_Entrega_03_Parte_III.docx',
              'Fuga_Identitaria_Entrega_03_Parte_III.pdf': delivery/'Fuga_Identitaria_Entrega_03_Parte_III.pdf',
              'figuras/FIG-07_DE_ONDE_CHEGAM_OS_MAPAS_DO_EU.svg': delivery/'figuras/FIG-07_DE_ONDE_CHEGAM_OS_MAPAS_DO_EU.svg',
              'figuras/FIG-07_DE_ONDE_CHEGAM_OS_MAPAS_DO_EU.png': delivery/'figuras/FIG-07_DE_ONDE_CHEGAM_OS_MAPAS_DO_EU.png',
              'figuras/FIG-08_O_CICLO_DA_RECOMENDACAO.svg': delivery/'figuras/FIG-08_O_CICLO_DA_RECOMENDACAO.svg',
              'figuras/FIG-08_O_CICLO_DA_RECOMENDACAO.png': delivery/'figuras/FIG-08_O_CICLO_DA_RECOMENDACAO.png',
              'figuras/FIG-09_EU_VIVIDO_E_EU_EXIBIDO.svg': delivery/'figuras/FIG-09_EU_VIVIDO_E_EU_EXIBIDO.svg',
              'figuras/FIG-09_EU_VIVIDO_E_EU_EXIBIDO.png': delivery/'figuras/FIG-09_EU_VIVIDO_E_EU_EXIBIDO.png',
              'figuras/FIG-10_QUANDO_A_CAUSA_COMECA_A_USAR_A_PESSOA.svg': delivery/'figuras/FIG-10_QUANDO_A_CAUSA_COMECA_A_USAR_A_PESSOA.svg',
              'figuras/FIG-10_QUANDO_A_CAUSA_COMECA_A_USAR_A_PESSOA.png': delivery/'figuras/FIG-10_QUANDO_A_CAUSA_COMECA_A_USAR_A_PESSOA.png',
              'build_entrega_03.py': delivery/'build_entrega_03.py',
          }
          text = registry.read_text(encoding='utf-8')
          for name, path in named.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              pattern = re.compile(rf'(\| `{re.escape(name)}` \| `)[0-9a-f]{{64}}(` \|)')
              text, count = pattern.subn(rf'\g<1>{digest}\g<2>', text)
              if count != 1:
                  raise SystemExit(f'Hash não localizado: {name}')
          registry.write_text(text, encoding='utf-8')

          research = root/'02-PESQUISA-E-CONTROLE/REGISTRO_PESQUISA_ENTREGA_03.md'
          research.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('/tmp/entrega03-source/PESQUISA/REGISTRO_PESQUISA_ENTREGA_03.md', research)
          for target in (root/'05-FERRAMENTAS/build_entrega_03.py', root/'repo_package/05-FERRAMENTAS/build_entrega_03.py'):
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(delivery/'build_entrega_03.py', target)
          for target in (root/'manuscrito/entregas/entrega-03', root/'repo_package/04-ENTREGAS-PARA-REVISAO/ENTREGA-03'):
              if target.exists():
                  shutil.rmtree(target)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(delivery, target)

          def append(path, marker, block):
              old = path.read_text(encoding='utf-8') if path.exists() else ''
              if marker not in old:
                  path.write_text(old.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          append(root/'README.md', '<!-- ENTREGA-03-2026-07-27 -->', '''
          <!-- ENTREGA-03-2026-07-27 -->
          ## Entrega 3 — Parte III concluída para revisão
          A Parte III — **Os fornecedores do eu** — foi produzida integralmente com os capítulos 8 a 12, 9.885 palavras principais, quatro figuras funcionais, DOCX e PDF. Está em `04-ENTREGAS-PARA-REVISAO/ENTREGA-03/`.
          **Estado:** Escrita integral → Auditoria factual → Revisão editorial → **Revisão de Sol**. Não aprovada e não fundida ao manuscrito mestre.
          ''')
          append(root/'STATUS_EDITORIAL.md', '<!-- STATUS-ENTREGA-03-2026-07-27 -->', '''
          <!-- STATUS-ENTREGA-03-2026-07-27 -->
          ## Entrega 3 — Parte III — Os fornecedores do eu
          - capítulos 8 a 12 completos;
          - texto principal: 9.885 palavras;
          - faixa editorial: 114–172;
          - figuras: FIG-07 a FIG-10;
          - DOCX e PDF auditados;
          - estado: **aguardando revisão de Sol**;
          - manuscrito mestre: **não alterado**;
          - próxima entrega preparada: Parte IV — capítulos 13 a 17.
          ''')
          append(root/'CHANGELOG.md', '<!-- CHANGELOG-ENTREGA-03-2026-07-27 -->', '''
          <!-- CHANGELOG-ENTREGA-03-2026-07-27 -->
          ## 2026-07-27 — Entrega 3
          - Parte III integral, capítulos 8 a 12, 9.885 palavras;
          - casos compostos, contracasos e oito Comandos de Autoria;
          - FIG-07 a FIG-10 em SVG e PNG;
          - DOCX refluível e PDF 14 × 21 cm;
          - registro editorial, pesquisa e prompt da Entrega 4;
          - cópias em `manuscrito/entregas/entrega-03/` e `repo_package/`;
          - nenhuma fusão ao manuscrito mestre.
          ''')
          append(root/'CONTINUIDADE_NOVO_CHAT.md', '<!-- CONTINUIDADE-ENTREGA-03-2026-07-27 -->', '''
          <!-- CONTINUIDADE-ENTREGA-03-2026-07-27 -->
          # Atualização de continuidade — Entrega 3 concluída
          A Parte III — *Os fornecedores do eu* — está tecnicamente completa em `04-ENTREGAS-PARA-REVISAO/ENTREGA-03/`, com capítulos 8 a 12, figuras, DOCX, PDF, registro editorial e pesquisa. Aguarda revisão de Sol. Não foi aprovada nem fundida ao manuscrito mestre.
          **Próximo escopo:** Entrega 4 — Parte IV — *A anatomia da ocupação*, capítulos 13 a 17, começando na página editorial 173. Prompt em `04-ENTREGAS-PARA-REVISAO/ENTREGA-03/PROMPT_PROXIMA_ENTREGA_04.md`.
          **Gatilho:** `Comece a Entrega 4.`
          ''')
          append(root/'02-PESQUISA-E-CONTROLE/FUGA_IDENTITARIA_CENTRAL_DE_PESQUISA.md', '<!-- CENTRAL-PESQUISA-ENTREGA-03-2026-07-27 -->', '''
          <!-- CENTRAL-PESQUISA-ENTREGA-03-2026-07-27 -->
          ## Registro de pesquisa — Entrega 3
          Fontes promovidas: desenvolvimento identitário, autonomia parental, mediação de mídia, recomendação algorítmica, comparação social, relações parassociais, avatares, fusão de identidade, feminismos, manosfera, terminologia LGBTQIA+, apagamento bissexual e comunidades therian/otherkin.
          Proteções: algoritmo não conhece essência; telas não diagnosticam; movimentos diferentes não foram igualados; LGBTQIA+ não foi tratada como fuga; therian/otherkin foram separados de LGBTQIA+ e de licantropia clínica; amostras qualitativas não foram usadas para prevalência.
          Registro detalhado: `02-PESQUISA-E-CONTROLE/REGISTRO_PESQUISA_ENTREGA_03.md`. Estado: aguardando revisão de Sol; sem fusão ao manuscrito mestre.
          ''')

          manifest_files = [delivery/'FUGA_IDENTITARIA_ENTREGA_03_TEXTO.md', delivery/'Fuga_Identitaria_Entrega_03_Parte_III.docx', delivery/'Fuga_Identitaria_Entrega_03_Parte_III.pdf', delivery/'REGISTRO_EDITORIAL_ENTREGA_03.md', delivery/'PROMPT_PROXIMA_ENTREGA_04.md', research, root/'05-FERRAMENTAS/build_entrega_03.py', *sorted((delivery/'figuras').glob('*'))]
          rows = []
          for path in manifest_files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f'| `{path.as_posix()}` | {path.stat().st_size:,} B | `{digest}` | Entrega 3 — revisão de Sol |')
          append(root/'MANIFESTO_DE_ARQUIVOS.md', '<!-- MANIFESTO-ENTREGA-03-2026-07-27 -->', '''
          <!-- MANIFESTO-ENTREGA-03-2026-07-27 -->
          ## Arquivos materiais da Entrega 3
          | Destino | Tamanho | SHA-256 | Função |
          |---|---:|---|---|
          ''' + '\n'.join(rows))
          PY

      - name: Limpar material operacional e publicar
        run: |
          rm -f .entrega03-source.part-* .entrega03-materialize .github/workflows/materialize-entrega-03.yml
          test -s 04-ENTREGAS-PARA-REVISAO/ENTREGA-03/Fuga_Identitaria_Entrega_03_Parte_III.pdf
          test -s manuscrito/entregas/entrega-03/Fuga_Identitaria_Entrega_03_Parte_III.docx
          test -s repo_package/04-ENTREGAS-PARA-REVISAO/ENTREGA-03/FUGA_IDENTITARIA_ENTREGA_03_TEXTO.md
          test -s 05-FERRAMENTAS/build_entrega_03.py
          test -s repo_package/05-FERRAMENTAS/build_entrega_03.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f
          git commit -m 'build: materializa Entrega 03 completa'
          git push origin HEAD:entrega-03-operacional
